<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>TradeVision UI Reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --background: #F5F5F7;
    --foreground: #17181C;
    --card: #FFFFFF;
    --muted: #F0F0F3;
    --muted-foreground: #6E7178;
    --accent: #EDE9FE;
    --accent-foreground: #5B21B6;
    --border: #E4E4E9;
    --primary: #7C3AED;
    --primary-foreground: #FFFFFF;
    --success: #16A34A;
    --success-soft: #DCFCE7;
    --success-border: #16A34A66;
    --warning: #EA580C;
    --warning-soft: #FFEDD5;
    --warning-border: #EA580C66;
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --danger-border: #DC262666;
    --brand: #7C3AED;
    --brand-soft: #EDE9FE;
    --editor-bg: #FFFFFF;
    --editor-line: #9A9DA6;
    --editor-kw: #AF00DB;
    --editor-num: #098658;
    --editor-fn: #795E26;
    --editor-com: #008000;
    --shadow: 0 1px 2px rgba(23,24,28,0.06), 0 4px 16px rgba(23,24,28,0.06);
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background: #0D1117; --foreground: #E6EDF3; --card: #161B22; --muted: #21262D;
      --muted-foreground: #8B949E; --accent: #2D1B69; --accent-foreground: #D9CBFF; --border: #30363D;
      --primary: #7C3AED; --primary-foreground: #F5F3FF;
      --success: #10B981; --success-soft: #0D2818; --success-border: #10B98140;
      --warning: #F5A524; --warning-soft: #2E2308; --warning-border: #F5A52440;
      --danger: #EF4444; --danger-soft: #2D0A0A; --danger-border: #EF444440;
      --brand: #8B5CF6; --brand-soft: #2D1B69;
      --editor-bg: #0D1117; --editor-line: #6E7681; --editor-kw: #C586C0; --editor-num: #B5CEA8;
      --editor-fn: #DCDCAA; --editor-com: #6A9955;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --background: #0D1117; --foreground: #E6EDF3; --card: #161B22; --muted: #21262D;
    --muted-foreground: #8B949E; --accent: #2D1B69; --accent-foreground: #D9CBFF; --border: #30363D;
    --primary: #7C3AED; --primary-foreground: #F5F3FF;
    --success: #10B981; --success-soft: #0D2818; --success-border: #10B98140;
    --warning: #F5A524; --warning-soft: #2E2308; --warning-border: #F5A52440;
    --danger: #EF4444; --danger-soft: #2D0A0A; --danger-border: #EF444440;
    --brand: #8B5CF6; --brand-soft: #2D1B69;
    --editor-bg: #0D1117; --editor-line: #6E7681; --editor-kw: #C586C0; --editor-num: #B5CEA8;
    --editor-fn: #DCDCAA; --editor-com: #6A9955;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--sans); font-size: 13.5px; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  a { color: inherit; }
  .num, td.r, .kpi .value, .kpi .delta, .sym .p, .sym .c, .wl-row .px, .heat td, kbd, pre.code, code, .editor-bar, .ticker { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted-foreground); }
  .up { color: var(--success); }
  .down { color: var(--danger); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }

  /* ---------- mock banner ---------- */
  .mockbar {
    display: flex; align-items: center; justify-content: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.4rem 1rem; font-size: 11px; color: var(--muted-foreground);
    background: var(--muted); border-bottom: 1px dashed var(--border);
  }
  .mockbar select { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.2rem 0.4rem; font-size: 11px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    border-radius: 6px; border: 1px solid transparent; font-size: 13px; font-weight: 500;
    padding: 0.55rem 0.9rem; cursor: pointer; white-space: nowrap; background: none;
    transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, filter 120ms ease;
  }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-outline { border-color: var(--border); background: var(--card); }
  .btn-outline:hover { background: var(--muted); }
  .btn-ghost { color: var(--muted-foreground); }
  .btn-ghost:hover { background: var(--muted); color: var(--foreground); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:disabled, .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  .btn-sm { padding: 0.35rem 0.6rem; font-size: 11px; }
  .btn-block { width: 100%; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--card);
    color: var(--muted-foreground); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
  }
  .icon-btn:hover { color: var(--foreground); background: var(--muted); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.bare { border: none; background: none; width: 26px; height: 26px; }
  .icon-btn.bare svg { width: 14px; height: 14px; }

  /* ---------- form controls ---------- */
  .field label { display: block; font-size: 11px; color: var(--muted-foreground); margin-bottom: 0.35rem; }
  .input, .select, .textarea {
    width: 100%; background: var(--muted); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.55rem 0.7rem; font-size: 13.5px;
  }
  .textarea { resize: none; }
  .input:hover, .select:hover, .textarea:hover { border-color: var(--muted-foreground); }
  .hint { font-size: 11px; color: var(--muted-foreground); margin-top: 0.3rem; }
  .switch { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
  .switch span { position: absolute; inset: 0; background: var(--border); border-radius: 99px; transition: background-color 120ms ease; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 120ms ease; }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---------- pills, badges, chips ---------- */
  .status { font-size: 12.5px; font-weight: 500; text-transform: capitalize; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.4rem; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .status.s-active, .status.s-completed, .status.s-live { color: var(--success); }
  .status.s-paused, .status.s-running, .status.s-queued { color: var(--warning); }
  .status.s-failed { color: var(--danger); }
  .status.s-archived { color: var(--muted-foreground); }
  .chip { font-family: var(--mono); font-size: 11px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.4rem; white-space: nowrap; }
  .tag { font-size: 10px; padding: 0.1rem 0.4rem; border-radius: 99px; background: var(--muted); color: var(--muted-foreground); }
  .seg { display: inline-flex; background: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { border: none; background: none; padding: 0.3rem 0.6rem; font-size: 11px; border-radius: 6px; cursor: pointer; color: var(--muted-foreground); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--foreground); box-shadow: var(--shadow); }
  .pill { background: var(--card); border: 1px solid var(--border); font-size: 12.5px; padding: 0.42rem 0.75rem; border-radius: 6px; cursor: pointer; }
  .pill:hover { border-color: var(--muted-foreground); }
  .pill[aria-pressed="true"] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }

  /* ---------- cards ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
  .card-pad { padding: 1.1rem 1.2rem; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.8rem 1.1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .card-head h3 { font-size: 13.5px; font-weight: 600; }
  .card-head .sub { font-size: 12px; color: var(--muted-foreground); margin-top: 0.1rem; }
  .card-body { padding: 1rem 1.1rem; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .kpi { padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); }
  .kpi .label { font-size: 12px; color: var(--muted-foreground); }
  .kpi .value { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .kpi .delta { font-size: 11px; font-variant-numeric: tabular-nums; }
  .kpi svg.spark { width: 100%; height: 28px; margin-top: 0.15rem; }

  /* ---------- tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); padding: 0.6rem 1.2rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 0.65rem 1.2rem; border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  th.r, td.r { text-align: right; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover td { background: var(--muted); }

  /* ---------- app shell ---------- */
  .app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 1.2rem;
    padding: 1rem 0.75rem; background: var(--card); border-right: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 0.55rem; font-weight: 700; font-size: 14px; padding: 0.25rem 0.5rem; cursor: pointer; text-decoration: none; }
  .logo .mark { display: inline-flex; color: var(--foreground); }
  .logo .mark svg { width: 20px; height: 20px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-foreground); padding: 0 0.6rem; margin: 0.6rem 0 0.3rem; }
  .nav a { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.6rem; border-radius: 8px; text-decoration: none; color: var(--muted-foreground); font-size: 12.5px; font-weight: 500; }
  .nav a svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav a:hover { background: var(--muted); color: var(--foreground); }
  .nav a[aria-current="page"] { background: var(--muted); color: var(--foreground); font-weight: 600; }
  .nav a .count { margin-left: auto; font-size: 10px; background: var(--muted); color: var(--muted-foreground); border-radius: 99px; padding: 0.05rem 0.4rem; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.6rem; }
  .user { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-foreground); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
  .user .who { min-width: 0; }
  .user .who b { display: block; font-size: 12px; }
  .user .who span { font-size: 10px; color: var(--muted-foreground); }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1.5rem;
    background: color-mix(in srgb, var(--background) 88%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .crumbs { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 0.4rem; align-items: center; min-width: 0; }
  .crumbs b { color: var(--foreground); font-weight: 600; }
  .gsearch { margin-left: auto; position: relative; width: min(320px, 40vw); }
  .gsearch svg { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted-foreground); }
  .gsearch input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.6rem 0.45rem 1.9rem; font-size: 12px; }
  .gsearch kbd { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 4px; padding: 0 0.3rem; }
  .badge-dot { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }

  .notif-panel {
    position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, 90vw); z-index: 30;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  .notif-panel .head { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; }
  .notif { display: flex; gap: 0.65rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 12px; }
  .notif:last-child { border-bottom: none; }
  .notif .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 0.3rem; flex-shrink: 0; }
  .notif.read .dot { background: transparent !important; border: 1px solid var(--border); }
  .notif b { display: block; font-size: 12px; margin-bottom: 0.15rem; }
  .notif span { color: var(--muted-foreground); font-size: 11px; }

  .content { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; max-width: 1320px; width: 100%; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  .page-head p { margin-top: 0.3rem; color: var(--muted-foreground); font-size: 12.5px; max-width: 60ch; }
  .page-head .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 12px; color: var(--muted-foreground); cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 0.5rem; }
  .back svg { width: 13px; height: 13px; }
  .back:hover { color: var(--foreground); }

  .cols-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
  .cols-even { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }

  @media (max-width: 1080px) { .cols-2, .cols-even { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .nav { flex-direction: row; }
    .nav-label, .side-foot, .nav a .count { display: none; }
    .nav a span.lbl { display: none; }
    .gsearch { display: none; }
    .topbar { padding: 0.6rem 1rem; }
    .crumbs + .spacer { margin-left: auto; }
    .content { padding: 1rem; }
  }

  /* ---------- charts ---------- */
  .chart { display: block; width: 100%; height: auto; }
  .chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted-foreground); }
  .legend { display: flex; gap: 1rem; font-size: 11px; color: var(--muted-foreground); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 0.35rem; }

  /* ---------- watchlist rows ---------- */
  .wl-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px auto; gap: 0.75rem; align-items: center; padding: 0.65rem 1.2rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  .wl-row:last-child { border-bottom: none; }
  .wl-row:hover { background: var(--muted); }
  .wl-row b { font-size: 12.5px; }
  .wl-row .sub { font-size: 11px; color: var(--muted-foreground); }
  .wl-row svg { width: 72px; height: 26px; }
  .wl-row .px { text-align: right; font-variant-numeric: tabular-nums; }
  .wl-row .px div:first-child { font-weight: 600; }
  .wl-row .px div:last-child { font-size: 11px; }

  .sym-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; }
  .sym { padding: 0.75rem 0.9rem; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 0.2rem; }
  .sym:hover { border-color: var(--muted-foreground); }
  .sym[aria-pressed="true"] { border-color: var(--foreground); box-shadow: inset 0 0 0 1px var(--foreground); }
  .sym .t { font-size: 11px; color: var(--muted-foreground); }
  .sym .p { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sym .c { font-size: 11px; font-variant-numeric: tabular-nums; }

  /* ---------- strategy cards ---------- */
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 0.9rem; }
  .s-card { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .s-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  .s-name { font-size: 13.5px; font-weight: 700; }
  .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .s-desc { font-size: 12px; color: var(--muted-foreground); line-height: 1.55; }
  .s-foot { margin-top: auto; padding-top: 0.6rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted-foreground); }
  .s-foot .acts { display: flex; gap: 0.1rem; }
  .s-foot .num { font-family: var(--sans); white-space: nowrap; }
  .stat-line { display: flex; gap: 1rem; font-size: 11px; color: var(--muted-foreground); }
  .stat-line b { color: var(--foreground); font-weight: 600; }
  .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .search { flex: 1 1 16rem; position: relative; }
  .search svg { position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted-foreground); }
  .search input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem 0.5rem 2rem; font-size: 12px; }
  .empty { padding: 3rem 1.5rem; text-align: center; color: var(--muted-foreground); border: 1px dashed var(--border); border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .empty b { color: var(--foreground); font-size: 13px; }

  /* ---------- editor ---------- */
  .editor { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .editor-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0.85rem; background: var(--muted); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted-foreground); }
  .editor-bar .dots { display: flex; gap: 0.3rem; }
  .editor-bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  pre.code { margin: 0; background: var(--editor-bg); padding: 0.9rem 0; font-size: 12.5px; line-height: 1.65; overflow-x: auto; min-height: 280px; }
  pre.code .ln { display: inline-block; width: 2.6rem; padding-right: 1rem; text-align: right; color: var(--editor-line); user-select: none; }
  .t-kw { color: var(--editor-kw); } .t-num { color: var(--editor-num); } .t-fn { color: var(--editor-fn); } .t-com { color: var(--editor-com); font-style: italic; }

  for (const m of all) {
    const b = a * (1 + m / 100);
    const walk = [0];
    for (let j = 1; j <= ppm; j++) walk.push(walk[j - 1] + (r() - 0.5));
    for (let j = 1; j <= ppm; j++) {
      const t = j / ppm;
      const base = a * Math.pow(b / a, t);
      const bridge = walk[j] - t * walk[ppm];
      out.push(base * (1 + bridge * 0.012));
    }
    a = b;
  }
  return out;
}

function spark(values, color) {
  const min = Math.min(...values), max = Math.max(...values), n = values.length;
  const pts = values.map((v, i) => [i / (n - 1) * 100, 30 - ((v - min) / (max - min || 1)) * 26 - 2]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" ");
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">
    <path d="${line} L100 32 L0 32 Z" style="fill:${color};fill-opacity:.12"/>
    <path d="${line}" style="fill:none;stroke:${color};stroke-width:1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

function lineChart({ series, w = 800, h = 280, fmt = (v) => fmtMoney(v, 0), xLabels = [], xFmt = (i) => `Point ${i + 1}` }) {
  const padL = 10, padR = 70, padT = 14, padB = 26;
  const all = series.flatMap(s => s.values);
  let min = Math.min(...all), max = Math.max(...all); const span = max - min; min -= span * 0.06; max += span * 0.06;
  const n = series[0].values.length;
  const x = (i) => padL + i / (n - 1) * (w - padL - padR);
  const y = (v) => padT + (max - v) / (max - min) * (h - padT - padB);
  const id = "c" + chartSeq++;
  CHARTS[id] = { kind: "line", series, n, w, x, y, xFmt, index: (vx) => Math.round((vx - padL) / (w - padL - padR) * (n - 1)) };
  const summary = series.map(s => `${s.label} from ${fmtMoney(s.values[0], 0)} to ${fmtMoney(s.values[n - 1], 0)}`).join("; ");
  let out = `<div class="chart-wrap" data-chart="${id}" tabindex="0" role="group" aria-label="Chart. Use the left and right arrow keys to read values."><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(summary)}">`;
  for (let g = 0; g <= 4; g++) {
    const v = min + (max - min) * g / 4, yy = y(v);
    out += `<line x1="${padL}" x2="${w - padR}" y1="${yy}" y2="${yy}" style="stroke:var(--border);stroke-dasharray:3 4"/>`;
    out += `<text x="${w - padR + 8}" y="${yy + 4}">${fmt(v)}</text>`;
  }
  xLabels.forEach(({ i, label }) => { out += `<text x="${x(i)}" y="${h - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${label}</text>`; });
  series.slice().reverse().forEach((s, idx) => {
    const primary = idx === series.length - 1;
    const d = s.values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    if (primary) out += `<path d="${d} L${x(n - 1)} ${h - padB} L${x(0)} ${h - padB} Z" style="fill:${s.color};fill-opacity:.1"/>`;
    out += `<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:${primary ? 2 : 1.5};${s.dashed ? "stroke-dasharray:5 4;" : ""}stroke-linejoin:round"/>`;
  });
  const last = series[0].values[n - 1];
  out += `<circle cx="${x(n - 1)}" cy="${y(last)}" r="4" style="fill:${series[0].color};stroke:var(--card);stroke-width:2"/>`;
  out += `<line class="xh" x1="0" x2="0" y1="${padT}" y2="${h - padB}" style="stroke:var(--muted-foreground);stroke-dasharray:2 3;visibility:hidden"/>`;
  series.forEach(s => { out += `<circle class="xd" r="4" style="fill:${s.color};stroke:var(--card);stroke-width:2;visibility:hidden"/>`; });
  return out + `</svg><div class="tip" hidden></div></div>`;
}

function candleChart(price, seed) {
  const r = rng(seed); const n = 64; let p = price * 0.92; const data = [];
  for (let i = 0; i < n; i++) {
    const o = p, c = o * (1 + (r() - 0.46) * 0.028);
    data.push({ o, c, h: Math.max(o, c) * (1 + r() * 0.009), l: Math.min(o, c) * (1 - r() * 0.009), v: 0.3 + r() * 0.7 });
    p = c;
  }
  const k = price / data[n - 1].c; data.forEach(d => { d.o *= k; d.c *= k; d.h *= k; d.l *= k; });
  const W = 820, H = 380, padR = 76, volH = 60, padT = 12, plotB = H - volH - 30;
  let min = Math.min(...data.map(d => d.l)), max = Math.max(...data.map(d => d.h));
  const y = (v) => padT + (max - v) / (max - min) * (plotB - padT);
  const cw = (W - padR - 10) / n;
  const id = "c" + chartSeq++;
  const row = (d) => `O ${d.o.toFixed(2)} · H ${d.h.toFixed(2)} · L ${d.l.toFixed(2)} · C ${d.c.toFixed(2)} · Vol ${(d.v * 62).toFixed(1)}M`;
  CHARTS[id] = { kind: "candle", data, n, w: W, row, x: (i) => 5 + i * cw + cw / 2, index: (vx) => Math.floor((vx - 5) / cw) };
  let s = `<div class="chart-wrap" data-chart="${id}" tabindex="0" role="group" aria-label="Candlestick chart. Use the left and right arrow keys to read each candle."><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${n} candles, last close ${price.toFixed(2)}, low ${min.toFixed(2)}, high ${max.toFixed(2)}">`;
  for (let g = 0; g <= 4; g++) {
    const v = min + (max - min) * g / 4, yy = y(v);
    s += `<line x1="0" x2="${W - padR}" y1="${yy}" y2="${yy}" style="stroke:var(--border);stroke-dasharray:3 4"/><text x="${W - padR + 8}" y="${yy + 4}">${v.toFixed(2)}</text>`;
  }
  data.forEach((d, i) => {
    const cx = 5 + i * cw + cw / 2, up = d.c >= d.o, col = up ? "var(--success)" : "var(--danger)";
    s += `<line x1="${cx}" x2="${cx}" y1="${y(d.h)}" y2="${y(d.l)}" style="stroke:${col};stroke-width:1"/>`;
    const top = y(Math.max(d.o, d.c)), bh = Math.max(1, Math.abs(y(d.o) - y(d.c)));
    s += `<rect x="${cx - cw * 0.32}" y="${top}" width="${cw * 0.64}" height="${bh}" rx="1" style="fill:${col}"/>`;
    const vh = d.v * (volH - 8);
    s += `<rect x="${cx - cw * 0.32}" y="${H - 22 - vh}" width="${cw * 0.64}" height="${vh}" style="fill:${col};fill-opacity:.35"/>`;
  });
  const ly = y(price);
  s += `<line x1="0" x2="${W - padR}" y1="${ly}" y2="${ly}" style="stroke:var(--brand);stroke-dasharray:4 3"/>`;
  s += `<rect x="${W - padR + 2}" y="${ly - 10}" width="${padR - 4}" height="20" rx="4" style="fill:var(--brand)"/><text x="${W - padR + 8}" y="${ly + 4}" style="fill:#fff;font-weight:700">${price.toFixed(2)}</text>`;
  ["09:30", "11:00", "12:30", "14:00", "15:30"].forEach((t, i) => { s += `<text x="${10 + i * (W - padR - 20) / 4}" y="${H - 4}">${t}</text>`; });
  s += `<line class="xh" x1="0" x2="0" y1="${padT}" y2="${H - 22}" style="stroke:var(--muted-foreground);stroke-dasharray:2 3;visibility:hidden"/>`;
  return { html: s + "</svg></div>", row: row(data[n - 1]) };
}

function bindCharts() {
  document.querySelectorAll(".chart-wrap").forEach((wrap) => {
    const c = CHARTS[wrap.dataset.chart]; if (!c) return;
    const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".tip"), xh = svg.querySelector(".xh");
    let idx = c.n - 1;
    const show = (i) => {
      idx = Math.max(0, Math.min(c.n - 1, i));
      const xv = c.x(idx);
      xh.setAttribute("x1", xv); xh.setAttribute("x2", xv); xh.style.visibility = "visible";
      if (c.kind === "candle") { const o = document.getElementById("ohlc"); if (o) o.textContent = c.row(c.data[idx]); return; }
      svg.querySelectorAll(".xd").forEach((dot, k) => { dot.setAttribute("cx", xv); dot.setAttribute("cy", c.y(c.series[k].values[idx])); dot.style.visibility = "visible"; });
      tip.innerHTML = `<b>${c.xFmt(idx)}</b>` + c.series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label)}<em>${fmtMoney(s.values[idx])}</em></span>`).join("");
      tip.hidden = false;
      const w = svg.getBoundingClientRect().width, px = xv / c.w * w;
      tip.style.left = (px > w * 0.6 ? px - tip.offsetWidth - 14 : px + 14) + "px";
    };
    const hide = () => {
      xh.style.visibility = "hidden";
      svg.querySelectorAll(".xd").forEach(d => { d.style.visibility = "hidden"; });
      if (tip) tip.hidden = true;
      if (c.kind === "candle") { const o = document.getElementById("ohlc"); if (o) o.textContent = c.row(c.data[c.n - 1]); }
    };
    const step = Math.max(1, Math.round(c.n / 60));
    wrap.addEventListener("pointermove", (ev) => { const r = svg.getBoundingClientRect(); show(c.index((ev.clientX - r.left) / r.width * c.w)); });
    wrap.addEventListener("pointerleave", hide);
    wrap.addEventListener("focus", () => show(idx));
    wrap.addEventListener("blur", hide);
    wrap.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowLeft") { ev.preventDefault(); show(idx - step); }
      if (ev.key === "ArrowRight") { ev.preventDefault(); show(idx + step); }
      if (ev.key === "Home") { ev.preventDefault(); show(0); }
      if (ev.key === "End") { ev.preventDefault(); show(c.n - 1); }
    });
  });
}

function highlight(code) {
  return code.split("\n").map((line, i) => {
    let html = esc(line);
    const ci = html.indexOf("//");
    let comment = "";
    if (ci >= 0) { comment = `<span class="t-com">${html.slice(ci)}</span>`; html = html.slice(0, ci); }
    html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="t-num">$1</span>')
               .replace(/\b(function|const|let|if|else|return)\b/g, '<span class="t-kw">$1</span>')
               .replace(/ctx\.(\w+)/g, 'ctx.<span class="t-fn">$1</span>');
    return `<span class="ln">${i + 1}</span>${html}${comment}`;
  }).join("\n");
}

const sortTh = (label, key, right) => {
  const active = btSort.key === key;
  return `<th class="${right ? "r" : ""}" ${active ? `aria-sort="${btSort.dir === "asc" ? "ascending" : "descending"}"` : ""}><button class="th-sort" data-sort="${key}">${label}<span class="arr" aria-hidden="true">${active ? (btSort.dir === "asc" ? "↑" : "↓") : "↕"}</span></button></th>`;
};
function sortedBacktests() {
  const list = BACKTESTS.slice();
  if (!btSort.key) return list;
  const k = btSort.key, m = btSort.dir === "asc" ? 1 : -1;
  return list.sort((a, b) => {
    const av = a[k], bv = b[k];
    if (av == null) return 1; if (bv == null) return -1;
    return (typeof av === "string" ? av.localeCompare(bv) : av - bv) * m;
  });
}
function pager(page, total, size) {
  const from = page * size + 1, to = Math.min(total, (page + 1) * size);
  return `<div class="pager"><span class="num">${from}–${to} of ${total}</span><div class="btns"><button class="btn btn-outline btn-sm" data-page="-1" ${page === 0 ? "disabled" : ""}>Previous</button><button class="btn btn-outline btn-sm" data-page="1" ${to >= total ? "disabled" : ""}>Next</button></div></div>`;
}

/* ================= router ================= */
function parse() {
  const raw = location.hash.replace(/^#\/?/, "") || "home";
  const [path, qs = ""] = raw.split("?");
  const q = Object.fromEntries(new URLSearchParams(qs));
  return { path: V[path] ? path : "home", q };
}

let runTimer = null;
function render() {
  const { path, q } = parse();
  if (path !== "backtests/result") runState = null;
  if (q.state && ["normal", "loading", "empty", "error"].includes(q.state)) mockState = q.state;
  CHARTS = {}; chartSeq = 0;
  document.getElementById("root").innerHTML = V[path](q);
  document.getElementById("screenPicker").value = path;
  document.getElementById("statePicker").value = mockState;
  document.title = "TradeVision UI Reference";
  bindCharts();
  if (path === "backtests/result" && q.run === "1" && runState !== "done") startRun();
}

function startRun() {
  clearInterval(runTimer);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pct = reduce ? 100 : 0;
  const start = Date.UTC(2024, 0, 2), end = Date.UTC(2025, 11, 31);
  const tick = () => {
    pct = Math.min(100, pct + 3);
    const bar = document.getElementById("runBar");
    if (!bar) { clearInterval(runTimer); return; }
    bar.style.width = pct + "%";
    document.getElementById("runPct").textContent = pct + "%";
    document.getElementById("runDate").textContent = "Processing " + fmtDate(new Date(start + (end - start) * pct / 100));
    if (pct >= 100) { clearInterval(runTimer); runState = "done"; setTimeout(() => { render(); toast("Backtest complete · AI analysis ready"); }, reduce ? 0 : 300); }
  };
  if (reduce) tick(); else runTimer = setInterval(tick, 70);
}

/* ================= theme ================= */
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}

/* ================= toast ================= */
let toastTimer, toastUndo = null;
function toast(msg, undo) {
  const t = document.getElementById("toast");
  toastUndo = undo || null;
  t.innerHTML = ic("check") + `<span>${esc(msg)}</span>` + (undo ? `<button class="toast-act" id="toastUndo">Undo</button>` : "");
  t.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 6000 : 2400);
}
function hideToast() {
  document.getElementById("toast").classList.remove("visible");
  toastUndo = null;
}
function markDirty() {
  const save = document.getElementById("saveBtn"); if (!save || !save.disabled) return;
  save.disabled = false;
  document.getElementById("dirtyNote").hidden = false;
  document.getElementById("discardBtn").hidden = false;
}
function fieldError(input, id, msg) {
  input.setAttribute("aria-invalid", "true");
  input.setAttribute("aria-describedby", id);
  if (!document.getElementById(id)) input.insertAdjacentHTML("afterend", `<p class="err" id="${id}">${msg}</p>`);
  input.focus();
}
function clearFieldError(input) {
  if (input.getAttribute("aria-invalid") !== "true") return;
  input.removeAttribute("aria-invalid");
  document.getElementById(input.getAttribute("aria-describedby"))?.remove();
  input.removeAttribute("aria-describedby");
}

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a, [data-go], [data-notif], tr, .wl-row");
  if (openMenu !== null && !(el && (el.closest(".menu") || el.dataset.menu))) { openMenu = null; if (!el) { render(); return; } }
  if (!el) { if (notifOpen) { notifOpen = false; render(); } return; }
  if (el.closest(".menu")) openMenu = null;

  if (el.id === "toastUndo") { const fn = toastUndo; hideToast(); if (fn) { fn(); render(); toast("Undone"); } return; }
  if (el.dataset.menu) { const id = +el.dataset.menu; openMenu = openMenu === id ? null : id; render(); if (openMenu !== null) document.querySelector(".menu [role=menuitem]")?.focus(); return; }
  if (el.hasAttribute("data-retry")) { mockState = "normal"; render(); toast("Loaded"); return; }
  if (el.dataset.sort) { const k = el.dataset.sort; btSort = btSort.key === k ? { key: k, dir: btSort.dir === "asc" ? "desc" : "asc" } : { key: k, dir: k === "strat" ? "asc" : "desc" }; render(); return; }
  if (el.dataset.page) { tradePage += +el.dataset.page; render(); return; }
  if (el.hasAttribute("data-save")) { const nv = Math.max(...VERSIONS.map(x => x.v)) + 1; VERSIONS.unshift({ v: nv, when: "Just now", note: "Edited name, settings or description" }); currentVersion = nv; render(); toast(`Saved as v${nv}`); return; }
  if (el.hasAttribute("data-discard")) { render(); toast("Changes discarded"); return; }

  if (el.id === "themeToggle") { document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark"); render(); return; }
  if (el.id === "bell") { notifOpen = !notifOpen; render(); return; }
  if (el.id === "markRead") { NOTIFS.forEach(n => n.read = true); render(); return; }
  if (el.dataset.notif) { const n = NOTIFS.find(x => x.id === +el.dataset.notif); n.read = true; notifOpen = false; go(n.go); return; }
  if (notifOpen && !el.closest(".notif-panel")) { notifOpen = false; }

  if (el.dataset.toast) toast(el.dataset.toast);
  if (el.dataset.go) { e.preventDefault(); go(el.dataset.go); return; }

  if (el.dataset.sym) { marketSym = el.dataset.sym; render(); return; }
  if (el.dataset.tf) { marketTf = el.dataset.tf; render(); return; }
  if (el.dataset.delAlert) {
    const i = ALERTS.findIndex(a => a.id === +el.dataset.delAlert); const [gone] = ALERTS.splice(i, 1);
    render(); toast(`Alert for ${gone.sym} deleted`, () => { ALERTS.splice(i, 0, gone); }); return;
  }

  if (el.dataset.filter) { stratFilter = el.dataset.filter; render(); return; }
  if (el.dataset.clone) {
    const s = STRATEGIES.find(x => x.id === +el.dataset.clone);
    STRATEGIES.unshift({ ...s, id: nextId++, name: s.name + " (Copy)", status: "active", version: 1, updated: "Just now" });
    render(); toast(`Duplicated as "${s.name} (Copy)"`); return;
  }
  if (el.dataset.toggle) { const s = STRATEGIES.find(x => x.id === +el.dataset.toggle); s.status = s.status === "active" ? "paused" : "active"; render(); toast(`${s.name} ${s.status === "active" ? "activated" : "paused"}`); return; }
  if (el.dataset.archive) { const s = STRATEGIES.find(x => x.id === +el.dataset.archive); const prev = s.status; s.status = "archived"; render(); toast(`"${s.name}" archived`, () => { s.status = prev; }); return; }
  if (el.dataset.unarchive) { const s = STRATEGIES.find(x => x.id === +el.dataset.unarchive); s.status = "paused"; render(); toast(`"${s.name}" restored as paused`); return; }

  if (el.dataset.tpl) { tplSel = el.dataset.tpl; render(); return; }
  if (el.hasAttribute("data-create")) {
    const nameEl = document.getElementById("sn"), name = nameEl.value.trim();
    if (!name) { fieldError(nameEl, "sn-err", "Give the strategy a name so you can find it later."); return; }
    STRATEGIES.unshift({ id: nextId++, name, asset: document.getElementById("sa").value || "AAPL", tf: document.getElementById("st").value, status: "active", version: 1, updated: "Just now", desc: document.getElementById("sd").value || "No description yet." });
    toast(`"${name}" created`); go(el.dataset.create === "backtest" ? "backtests/new" : "strategies"); return;
  }

  if (el.dataset.restore) {
    const v = +el.dataset.restore; const nv = Math.max(...VERSIONS.map(x => x.v)) + 1;
    VERSIONS.unshift({ v: nv, when: "Just now", note: `Restored from v${v}` }); currentVersion = nv;
    toast(`Restored v${v} as v${nv}`); render(); return;
  }

  if (el.hasAttribute("data-cancel")) { clearInterval(runTimer); toast("Backtest cancelled"); go("backtests"); return; }

  if (el.dataset.cclone) { const c = COMMUNITY[+el.dataset.cclone]; STRATEGIES.unshift({ id: nextId++, name: c.name, asset: c.asset, tf: c.tf, status: "paused", version: 1, updated: "Just now", desc: c.desc }); toast(`"${c.name}" cloned to your strategies`); return; }

  if (el.hasAttribute("data-newkey")) { const id = nextKeyId++; newKey = { name: "New key " + id, secret: "tv_live_" + Array.from({ length: 32 }, (_, i) => "abcdef0123456789"[(i * 7 + id * 3) % 16]).join("") }; API_KEYS.unshift({ id, name: newKey.name, created: "Oct 10, 2026", used: "never" }); render(); return; }
  if (el.dataset.revoke) { revokeArm = +el.dataset.revoke; render(); document.querySelector("[data-revoke-cancel]")?.focus(); return; }
  if (el.hasAttribute("data-revoke-cancel")) { revokeArm = null; render(); return; }
  if (el.dataset.revokeConfirm) { const k = API_KEYS.find(x => x.id === +el.dataset.revokeConfirm); API_KEYS = API_KEYS.filter(x => x !== k); revokeArm = null; newKey = null; render(); toast(`"${k.name}" revoked`); return; }
  if (el.hasAttribute("data-arm-del")) { deleteArmed = true; render(); document.getElementById("delConfirm").focus(); return; }
  if (el.hasAttribute("data-cancel-del")) { deleteArmed = false; render(); return; }
  if (el.id === "delBtn") { deleteArmed = false; toast("Account deletion scheduled. You have 7 days to undo it."); render(); return; }

  if ((notifOpen === false && document.querySelector(".notif-panel")) || (openMenu === null && document.querySelector(".menu"))) render();
});

document.addEventListener("change", (e) => {
  if (e.target.id === "screenPicker") { notifOpen = false; go(e.target.value); }
  if (e.target.id === "statePicker") { mockState = e.target.value; render(); }
  if (e.target.dataset.pstrat !== undefined) { const s = PORT_STRATS[+e.target.dataset.pstrat]; s.on = e.target.checked; toast(`${s.name} ${s.on ? "resumed" : "paused"}`); }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "stratSearch") {
    stratQuery = e.target.value; const pos = e.target.selectionStart; render();
    const inp = document.getElementById("stratSearch"); inp.focus(); inp.setSelectionRange(pos, pos);
  }
  if (e.target.id === "delConfirm") document.getElementById("delBtn").disabled = e.target.value !== "DELETE";
  if (e.target.closest && e.target.closest("#editForm")) markDirty();
  if (["sn", "bf", "bto"].includes(e.target.id)) { clearFieldError(e.target); if (e.target.id === "bf") clearFieldError(document.getElementById("bto")); }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "authForm") { if (f.dataset.toast) toast(f.dataset.toast); go(f.dataset.next); }
  if (f.id === "alertForm") {
    const price = parseFloat(document.getElementById("ap").value);
    if (!price) { toast("Enter a price to create the alert"); return; }
    ALERTS.unshift({ id: nextAlertId++, sym: document.getElementById("as").value, cond: document.getElementById("ac").value, price });
    toast("Alert created"); render();
  }
  if (f.id === "btForm") {
    const from = document.getElementById("bf"), to = document.getElementById("bto");
    if (!from.value || !to.value || to.value <= from.value) { fieldError(to, "bto-err", "The end date has to be after the start date."); return; }
    runState = null; go("backtests/result?run=1");
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !e.target.matches("input, textarea, select")) { const s = document.querySelector(".gsearch input"); if (s) { e.preventDefault(); s.focus(); } }
  if (e.key === "Escape" && openMenu !== null) { const id = openMenu; openMenu = null; render(); document.querySelector(`[data-menu="${id}"]`)?.focus(); return; }
  if (e.key === "Escape" && notifOpen) { notifOpen = false; render(); }
  if (e.key === "Enter" && e.target.matches("[data-go][tabindex], .wl-row")) e.target.click();
});

const picker = document.getElementById("screenPicker");
picker.innerHTML = SCREENS.map(([r, l]) => `<option value="${r}">${l}</option>`).join("");
window.addEventListener("hashchange", () => { notifOpen = false; render(); });
if (!location.hash) location.hash = "#/dashboard"; else render();
